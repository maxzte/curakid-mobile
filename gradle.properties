# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased memory for better performance in multi-module projects.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enable parallel execution of tasks for faster builds.
org.gradle.parallel=true

# Enable build caching to reuse results from previous builds.
org.gradle.caching=true

# Enable Configuration Cache for faster build starts.
org.gradle.configuration-cache=true

# Enable non-transitive R classes for faster compilation of library modules.
android.nonTransitiveRClass=true

# Disable Jetifier as most modern libraries support AndroidX natively.
android.enableJetifier=false

# Enable R8 full mode for better code shrinking.
android.enableR8.fullMode=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Kotlin incremental compilation for better performance.
kotlin.incremental=true
